# Cloudflare Pages configuration.
#
# This file declares the RESOURCE BINDINGS the Pages Functions expect. It holds
# no secrets — every secret (Resend key, Turnstile secret) is set in the
# Cloudflare dashboard under Settings → Environment variables, marked "Encrypt".
#
# The database_id below is a placeholder. Fill it in after running:
#   npx wrangler d1 create spartan-shield
# See DEPLOYMENT.md.

name = "spartan-shield-web"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# --- D1 -----------------------------------------------------------------
# Contact submissions (with the consent record) and job applications.
[[d1_databases]]
binding = "DB"
database_name = "spartan-shield"
database_id = "REPLACE_AFTER_RUNNING_WRANGLER_D1_CREATE"

# --- R2 -----------------------------------------------------------------
# Resume files. This bucket must NOT have public access enabled — resumes are
# served only through /api/admin/resume/:id, behind a verified Access JWT.
[[r2_buckets]]
binding = "RESUMES"
bucket_name = "spartan-shield-resumes"

# --- Non-secret variables ------------------------------------------------
# Secrets are NOT listed here. Set these in the dashboard as well if you
# prefer a single place; values here are safe defaults for a fresh deploy.
[vars]
ENABLE_EMAIL_NOTIFY = "false"
NOTIFY_EMAILS = "sam@spartanshieldins.com,nick@spartanshieldins.com"
NOTIFY_FROM = "notifications@send.spartanshieldins.com"
