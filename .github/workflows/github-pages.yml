# Deploys a static preview of the site to GitHub Pages.
#
# READ THIS BEFORE RELYING ON IT:
#
# GitHub Pages serves static files only. It cannot run Cloudflare Pages
# Functions, so on this deploy:
#
#   · the contact form RENDERS (the consent block is fully visible, which is
#     what a TCR reviewer needs to see) but SUBMITTING it will fail
#   · the job application form will fail on submit
#   · /careers/admin will load but show an error, and there is no Cloudflare
#     Access in front of it
#
# That makes this fine for showing people the design and for reviewing copy.
# It is NOT the production target. Production is Cloudflare Pages, where the
# forms, D1, R2, and Access all work — see DEPLOYMENT.md.
#
# SETUP: repository Settings → Pages → Source → "GitHub Actions". That is all;
# this workflow does the rest on every push to the default branch.

name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # actions/configure-pages resolves these for both user sites
          # (served at the root) and project sites (served at /<repo>/), so
          # the same workflow works either way.
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Add .nojekyll
        # Without this, GitHub Pages' Jekyll pass strips directories whose
        # names begin with an underscore — which would silently delete
        # Astro's _astro/ bundle directory and leave an unstyled site.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
